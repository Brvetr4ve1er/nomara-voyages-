      <stop offset="1" stop-color="#07919A"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#043F46" flood-opacity=".24"/>
