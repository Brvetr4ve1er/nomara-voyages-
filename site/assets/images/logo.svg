      <ellipse cx="67" cy="67" rx="24" ry="44" transform="rotate(-18 67 67)" fill="#FEB72C"/>
      <path fill="#0696A1" d="M37 70c12-8 27-13 44-13 4 0 7 2 7 5s-3 5-7 5c-8 0-15 1-22 3l18 17c2 2 2 5 0 7-2 2-5 2-7 0L49 75c-8 3-15 5-22 5-4 0-7-2-7-5 0-4 5-5 17-5Z"/>
    </g>
  </g>

  <g transform="translate(187 11)">
    <g font-family="Changa, 'Readex Pro', Arial, sans-serif" font-weight="700" font-size="78" fill="#FFFFFF" stroke="#078CA0" stroke-width="5.5" paint-order="stroke fill">
      <text x="0" y="85">N</text>
      <text x="236" y="85">mara</text>
    </g>
