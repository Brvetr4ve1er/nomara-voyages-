      <ellipse cx="86" cy="71" rx="28" ry="48" transform="rotate(-18 86 71)" fill="#FEB72C"/>
      <path fill="#0696A1" d="M47 76c15-9 33-15 53-15 5 0 9 3 9 6s-4 6-9 6c-9 0-18 2-26 4l22 19c3 2 3 6 1 8-3 3-6 3-9 0L62 82c-9 3-18 5-27 5-5 0-9-2-9-6 0-5 7-5 21-5Z"/>
