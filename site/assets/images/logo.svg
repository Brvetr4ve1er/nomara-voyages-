    <filter id="markShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#044A51" flood-opacity=".32"/>
    </filter>
  </defs>

  <g transform="translate(16 21)" filter="url(#softShadow)">
